name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: az-cvm-vtpm

    steps:
    - uses: actions/checkout@v3

    - name: Install deps
      run: sudo apt-get update && sudo apt-get install -y libtss2-dev

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        components: rustfmt, clippy
        override: true

    - name: Build
      run: cargo build --all

    - name: Check verifier-only
      run: cargo check --no-default-features --features=verifier

    - name: Check attester-only
      run: cargo check --no-default-features --features=attester

    - name: Run tests
      run: cargo test --all

    - name: Compile integration tests
      run: cargo test --all --features integration_test --no-run

    - name: Format
      run: cargo fmt --all -- --check

    - name: Lint
      run: cargo clippy --all-targets --all-features --all -- -D warnings

  # Runs without libtss2-dev installed, proving that quote verification
  # builds and passes its tests without the native TPM stack.
  # TODO: sev verification still won't run on macos because it depends on sev/openssl, 
  # whose rdrand dependency is x86_64-only. Migrate az-snp-vtpm report validation from 
  # openssl EcdsaSig to sev/crypto_nossl (pure-Rust p384), then run this step on macOS too.
  portable-verifier:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: az-cvm-vtpm

    steps:
    - uses: actions/checkout@v3

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Test az-cvm-vtpm verifier
      run: cargo test --no-default-features --features=verifier

    - name: Check az-tdx-vtpm verifier
      run: cargo check -p az-tdx-vtpm --no-default-features --features=verifier

    # ubuntu-only until the sev/crypto_nossl migration (see job TODO above)
    - name: Check az-snp-vtpm verifier
      if: matrix.os == 'ubuntu-latest'
      run: cargo check -p az-snp-vtpm --no-default-features --features=verifier
